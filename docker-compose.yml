services:
  omepic:
    build: .
    ports:
      - "${HTTP_ADDR:-:8080}:8080"
    environment:
      - APP_ENV=production
      - HTTP_ADDR=:8080
      - DATABASE_PATH=/opt/omepic/data/omepic.db
      - REDIS_URL=redis://redis:6379/0
      - UID_PREFIX=${UID_PREFIX:-omeo_}
      - UID_ENCRYPTION_KEY=${UID_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
    volumes:
      - omepic-data:/opt/omepic/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  omepic-data:
  redis-data: