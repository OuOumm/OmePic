name: Bug 报告
description: 报告一个 Bug，帮助我们改进 OmePic
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告 Bug！请尽量填写以下信息，方便快速定位问题。

  - type: input
    id: version
    attributes:
      label: OmePic 版本
      description: 运行的版本号或 commit hash
      placeholder: "v1.0.0 或 abc1234"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Docker Compose
        - Docker 单容器
        - Linux 本地编译
        - macOS 本地编译
        - Windows 本地编译
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go 版本
      placeholder: "go version go1.25 linux/amd64"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      placeholder: "v20.x.x"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 产生问题的具体操作步骤
      placeholder: |
        1. 进入管理后台
        2. 点击「存储设置」
        3. 添加 S3 存储实例
        4. 点击保存，页面报错
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望会发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 后端日志、浏览器控制台输出等（如有）
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如适用，拖拽截图到这里上传
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何你认为有助于理解问题的额外信息（反向代理配置、特殊环境变量等）
    validations:
      required: false
